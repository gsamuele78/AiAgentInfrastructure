name: validate
# CI di sola VALIDAZIONE statica (vedi docs/adr/0010). Nessun deploy.
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:
permissions: { contents: read }

jobs:
  syntax:
    name: Sintassi e lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12" }
      - run: |
          python -m pip install --quiet pyyaml
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: YAML / JSON / JSONC / TOML
        run: |
          python - <<'PY'
          import yaml, json, re, pathlib, sys, tomllib
          bad = 0
          def check(p, fn):
              global bad
              try: fn(p); print(f"  ok   {p}")
              except Exception as e: print(f"  FAIL {p}: {e}"); bad += 1
          for f in pathlib.Path(".").rglob("*.y*ml"):
              if ".git" in f.parts: continue
              check(f, lambda p: list(yaml.safe_load_all(p.read_text())))
          for f in list(pathlib.Path(".").rglob("*.json")) + list(pathlib.Path(".").rglob("*.jsonc")):
              if ".git" in f.parts: continue
              def j(p):
                  t = re.sub(r'^\s*//.*$', '', p.read_text(), flags=re.M)
                  json.loads(re.sub(r',(\s*[}\]])', r'\1', t))
              check(f, j)
          for f in pathlib.Path(".").rglob("*.toml"):
              if ".git" in f.parts: continue
              check(f, lambda p: tomllib.load(p.open("rb")))
          sys.exit(bad)
          PY
      - name: Python
        run: python -m compileall -q scripts/
      - name: Shell
        run: |
          fail=0
          for s in $(find . -name '*.sh' -not -path './.git/*'); do
            bash -n "$s" || fail=1
            shellcheck -e SC1091,SC2086,SC2181,SC2015,SC2016 -S error "$s" || fail=1
          done
          exit $fail

  scripts:
    name: Test degli script (contratti, invarianti sicurezza)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet pyyaml
      - name: Suite test-scripts
        # Verifica: sintassi, bit eseguibile, contratto --dry-run,
        # invarianti di sicurezza (Ollama mai su 0.0.0.0, postgres non
        # esposto, vLLM su loopback, conferma su --destroy), coerenza ADR.
        run: ./scripts/test-scripts.sh
      - name: Dry-run degli script che modificano il sistema
        # Devono uscire puliti anche su una macchina che non ha nulla:
        # se un dry-run crasha, crasherebbe anche l'esecuzione reale.
        # env -u USER: su un runner USER e' impostato, su un container no.
        # create-vm.sh moriva proprio li' ("USER: unbound variable").
        run: |
          ./scripts/detect-hardware.sh > /dev/null
          for s in setup-ollama cleanup-host deploy-all create-vm restore-test \
                   backup-db stack-selective-install; do
            env -u USER "./scripts/$s.sh" --dry-run > /dev/null \
              || { echo "::error::$s.sh --dry-run fallito"; exit 1; }
          done
          echo "tutti i dry-run completati senza errori"

  mutation:
    name: Mutazioni (ogni controllo sa fallire)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12" }
      # pyyaml serve: senza, i controlli sui compose sono "skip" e le loro
      # mutazioni risulterebbero buchi (verde dove ci si aspetta rosso).
      - run: python -m pip install --quiet pyyaml
      - name: Catalogo tests/mutation/catalog.tsv
        run: tests/mutation/run.sh

  os-matrix:
    # P2 / TC-13 (PLAN-STACK-VALIDATION, Fase C "Matrice OS"): gli strati S3/S4
    # e il rilevamento girano davvero su Debian 13 e Fedora, non solo su Ubuntu.
    # rpm-ostree (Bazzite, S1) in un container non ha senso: lo coprono le
    # fixture di tests/platform, e la prova vera resta manuale (ADR-0018).
    name: OS reale ${{ matrix.image }} (fatti, TC-13, LLM locale)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: "debian:13"
            family: debian
            prep: apt-get update -qq && apt-get install -y -qq --no-install-recommends python3 git ca-certificates iproute2 procps >/dev/null
          - image: "fedora:44"
            family: fedora
            prep: dnf install -y -q python3 git-core iproute procps-ng findutils diffutils gawk >/dev/null
    container: ${{ matrix.image }}
    defaults: { run: { shell: bash } }
    steps:
      - name: Prerequisiti minimi
        run: ${{ matrix.prep }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fatti del sistema reale (detect-hardware.sh --json)
        env: { FAMILY: "${{ matrix.family }}" }
        run: |
          ./scripts/detect-hardware.sh --json | tee /tmp/facts.json
          python3 - <<'PY'
          import json, os, sys
          f = json.load(open("/tmp/facts.json"))
          bad = []
          if f.get("schema") != 1: bad.append(f"schema {f.get('schema')}")
          if f.get("os_family") != os.environ["FAMILY"]: bad.append(f"os_family {f.get('os_family')} != {os.environ['FAMILY']}")
          if f.get("atomic") is not False: bad.append("atomic dovrebbe essere false")
          if not f.get("sandbox"): bad.append("dentro un container sandbox non puo' essere vuoto")
          if not isinstance(f.get("ram_gb"), int) or f["ram_gb"] <= 0: bad.append(f"ram_gb {f.get('ram_gb')}")
          print("\n".join(bad) or "fatti coerenti con il container")
          sys.exit(1 if bad else 0)
          PY
      - name: TC-13 su fixture
        run: tests/platform/run.sh
      - name: LLM locale su sistema finto (setup-ollama, 48 scenari)
        run: tests/setup-ollama/run.sh

  serena:
    name: Serena carica .serena/project.yml (versione del pin)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12" }
      # Su una PR di Dependabot che alza serena-agent, e' QUESTO job a dire se
      # la nuova versione carica ancora il file (rilievo A15: KeyError).
      - run: python -m pip install --quiet uv==0.11.7
      - run: tests/serena/check-project-yml.sh

  build:
    name: Build immagine (gate callback)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Il .env va creato davvero: `--env-file` cambia solo l'interpolazione
      # delle variabili, NON soddisfa la chiave `env_file:` del servizio, che
      # richiede il file su disco. Il workspace del runner e' effimero.
      - name: compose config
        working-directory: services
        run: cp .env.example .env && docker compose config >/dev/null && echo OK
      - name: compose BIOME valido
        working-directory: services-biome
        run: cp .env.example .env && BIND_IP=127.0.0.1 docker compose config >/dev/null && echo OK
      - name: docker build
        working-directory: services
        # Il Dockerfile contiene il gate `import HeadroomCallback`: se il
        # callback non è importabile la build fallisce qui, non in produzione.
        run: docker build -t litellm-headroom:ci .

  secrets:
    name: Nessun segreto committato
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          if grep -rInE '(sk-ant-[A-Za-z0-9]{20,}|sk-or-v1-[A-Za-z0-9]{20,}|sk-[A-Za-z0-9]{40,})' \
               --exclude-dir=.git . | grep -viE 'CHANGEME|example|placeholder|<'; then
            echo "::error::Possibile segreto reale committato"; exit 1
          fi
          grep -q '\.env' .gitignore || { echo "::error::.env non in .gitignore"; exit 1; }
          echo "nessun segreto rilevato"

  docs:
    name: Coerenza ADR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: |
          fail=0
          for f in $(grep -oE '\(([0-9]{4}-[a-z0-9-]+\.md)\)' docs/adr/README.md | tr -d '()'); do
            [ -f "docs/adr/$f" ] || { echo "::error::ADR mancante: $f"; fail=1; }
          done
          for f in docs/adr/[0-9]*.md; do
            grep -q '^- \*\*Status\*\*' "$f" || { echo "::error::$f senza Status"; fail=1; }
          done
          exit $fail
