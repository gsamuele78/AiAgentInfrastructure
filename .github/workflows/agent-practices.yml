name: agent-practices
# Pratiche importate da OpenHands (ADR-0025) che hanno bisogno di installare qualcosa.
# Le parti offline (golden task, corpus di rischio, skill, AGENTS.md) girano gia' dentro
# test-scripts.sh (validate.yml §6c). Solo validazione: nessun deploy (ADR-0010).
on:
  push: { branches: [main] }
  pull_request:
    paths:
      - services/litellm_config.yaml
      - services/Dockerfile
      - tests/gateway-mock/**
      - bench/compliance/**
      - bench/secret-canary/**
      - .github/workflows/agent-practices.yml
  workflow_dispatch:
permissions: { contents: read }

jobs:
  gateway-mock:
    name: Catena auto su LiteLLM mock (G1-G8)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "3.12" }
      - run: python -m pip install --quiet pyyaml
      - name: Gateway mock
        # LiteLLM alla versione del FROM di services/Dockerfile (run.sh la legge da li'),
        # config derivata da services/litellm_config.yaml: nessun segreto, nessun provider.
        run: tests/gateway-mock/run.sh
