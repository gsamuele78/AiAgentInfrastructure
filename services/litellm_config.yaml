model_list:
  - model_name: claude-opus-4-8
    litellm_params: { model: claude-opus-4-8, api_key: os.environ/ANTHROPIC_API_KEY }
    cache_control_injection_points: [ { location: message, role: system } ]
  - model_name: claude-sonnet-4-6
    litellm_params: { model: claude-sonnet-4-6, api_key: os.environ/ANTHROPIC_API_KEY }
  - model_name: claude-haiku-4-5-20251001
    litellm_params: { model: claude-haiku-4-5-20251001, api_key: os.environ/ANTHROPIC_API_KEY }
  - model_name: anthropic-claude          # lane abbonamento (auth dal client)
    litellm_params: { model: anthropic/claude-sonnet-4-6 }
  - model_name: "openrouter/*"
    litellm_params: { model: "openrouter/*", api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: or-pareto-code
    litellm_params: { model: openrouter/openrouter/pareto-code, api_key: os.environ/OPENROUTER_API_KEY }
  - model_name: or-private                # lane privacy dati BIOME
    litellm_params:
      model: openrouter/openrouter/auto:exacto
      api_key: os.environ/OPENROUTER_API_KEY
      extra_body: { provider: { data_collection: deny, require_parameters: true } }

  # --- F5: lane locale (ADR-0008) -------------------------------------------
  # Ollama gira SULL'HOST, bindato sul bridge libvirt: dalla VM l'host e'
  # 192.168.122.1. Il modello lo sceglie setup-ollama.sh in base alla VRAM: se
  # scarichi taglie diverse, allinea `model` qui.
  # Se Ollama non e' attivo, queste lane rispondono errore: sono le UNICHE che
  # dipendono da un servizio fuori dalla VM.
  - model_name: local-fast                # 3B full-VRAM: latenza bassa, FIM
    litellm_params:
      model: ollama_chat/qwen2.5-coder:3b
      api_base: http://192.168.122.1:11434
      timeout: 300
  - model_name: local-good                # 7B offload: qualita' migliore
    litellm_params:
      model: ollama_chat/qwen2.5-coder:7b
      api_base: http://192.168.122.1:11434
      timeout: 300

  # --- F6: lane BIOME L40S (ADR-0009) ---------------------------------------
  # Non si parla a nginx in chiaro: `biome-tls` e' lo stunnel client che porta
  # il certificato mTLS (services-biome/stunnel.conf). Richiede la VPN di ateneo
  # attiva sull'HOST: vedi il gotcha VM->VPN in docs/BIOME-L40S.md.
  - model_name: biome-coder
    litellm_params:
      model: openai/biome-coder
      api_base: http://biome-tls:8443/v1
      api_key: os.environ/VLLM_API_KEY
      timeout: 600
litellm_settings:
  callbacks: ["headroom.integrations.litellm_callback.HeadroomCallback"]
  forward_client_headers_to_llm_api: true
  num_retries: 2
  request_timeout: 600
  drop_params: true
  set_verbose: false
  fallbacks:
    - coding: ["or-pareto-code", "claude-opus-4-8"]
    - smart:  ["or-private", "claude-sonnet-4-6"]
    - cheap:  ["openrouter/openrouter/free", "claude-haiku-4-5-20251001"]
    - local:  ["local-good", "local-fast"]
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: true
  allow_requests_on_db_unavailable: false
router_settings:
  routing_strategy: simple-shuffle
  allowed_fails: 3
  cooldown_time: 60
  enable_pre_call_checks: true
