# Sidecar mTLS LATO CLIENT: gira NELLA VM DEL GATEWAY (servizio 'biome-tls'
# in services/docker-compose.yml, profilo 'biome'), non sul server BIOME.
# Per questo sta in services/ e non in services-biome/.
# LiteLLM parla HTTP in locale al sidecar; il sidecar fa mTLS verso BIOME.
# Scelta PSE: non dipendere dal supporto ai client-cert di LiteLLM, che
# varia tra versioni.
foreground = yes
output = /dev/stdout

[biome-llm]
client = yes
accept  = 0.0.0.0:8443                    # LiteLLM chiama qui, in chiaro
connect = biome-llm.<dominio-interno>:8443   # adatta all'FQDN reale
cert    = /certs/client.crt               # certificato CLIENT (mTLS)
key     = /certs/client.key
CAfile  = /certs/step-root.crt            # valida il server
verifyChain = yes
sslVersion = TLSv1.3
