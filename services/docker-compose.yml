services:
  litellm:
    build:
      context: .
      args:
        LITELLM_IMAGE_TAG: "${LITELLM_IMAGE_TAG:-main-stable}"
        # vuoto = solo il core di headroom-ai (vedi Dockerfile: [all] = torch)
        HEADROOM_EXTRAS: "${HEADROOM_EXTRAS:-}"
    image: litellm-headroom:local
    container_name: litellm
    restart: unless-stopped
    ports: ["0.0.0.0:4000:4000"]
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://litellm:${POSTGRES_PASSWORD}@db:5432/litellm"
      STORE_MODEL_IN_DB: "true"
    volumes: ["./litellm_config.yaml:/app/config.yaml:ro"]
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "litellm", "--health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
    logging:
      driver: local
      options: { max-size: "15m", max-file: "5" }
  db:
    image: postgres:16-alpine
    container_name: litellm-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 5
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "1.0", memory: 1G }
    logging:
      driver: local
      options: { max-size: "15m", max-file: "5" }
  # --- F6: sidecar mTLS verso BIOME (ADR-0009) ------------------------------
  # litellm_config.yaml punta `biome-coder` a http://biome-tls:8443/v1: senza
  # questo servizio quel nome non risolve e la lane fallisce. Sta dietro un
  # profilo, quindi NON parte (e non pretende certificati) per chi non usa BIOME:
  #   docker compose --profile biome up -d
  # Richiede ./certs/{client.crt,client.key,step-root.crt} -- vedi
  # docs/BIOME-L40S.md -- e la VPN di ateneo attiva sull'host.
  biome-tls:
    profiles: ["biome"]
    image: alpine:3.20
    container_name: biome-tls
    restart: unless-stopped
    command: sh -c "apk add --no-cache stunnel && exec stunnel /etc/stunnel/stunnel.conf"
    volumes:
      - ./stunnel-biome.conf:/etc/stunnel/stunnel.conf:ro
      - ./certs:/certs:ro
    security_opt: ["no-new-privileges:true"]
    deploy:
      resources:
        limits: { cpus: "0.5", memory: 128M }
    logging:
      driver: local
      options: { max-size: "5m", max-file: "3" }

volumes:
  pgdata: {}
