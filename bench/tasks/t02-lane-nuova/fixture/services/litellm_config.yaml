model_list:
  - model_name: claude-sonnet-4-6
    litellm_params:
      model: claude-sonnet-4-6
      api_key: os.environ/ANTHROPIC_API_KEY
      cache_control_injection_points: [ { location: message, role: system }, { location: message, index: -1 } ]
  - model_name: cheap
    litellm_params: { model: openrouter/openrouter/free, api_key: os.environ/OPENROUTER_API_KEY }
litellm_settings:
  fallbacks:
    - cheap: ["claude-sonnet-4-6"]
