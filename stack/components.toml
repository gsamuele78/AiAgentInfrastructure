# stack/components.toml — cosa compone lo stack (ADR-0017), sottoinsieme P1.
#
# Differenza voluta dallo schema di ADR-0017: qui NON c'e' un campo `version`.
# La versione vive in UN posto solo, quello che Dependabot legge (`pin`); un
# secondo numero qui sarebbe una seconda verita'. `stack.py` (P3) leggera' la
# versione da `pin`. I campi `probe`, `health`, `files`, `rollback` arrivano con P3.
#
# Campi:
#   layer    ADR-0006 (gateway, storage, compressione, tooling-codice, mcp, skill, agente, ci, runtime)
#   scope    vm · host · client · biome · ci
#   pin      file che contiene la versione, oppure "none" (motivo in `note`)
#   tracked  il pin e' letto da Dependabot (true/false) — misura di P1
#   key      nome del pacchetto/immagine dentro `pin` (per il controllo di coerenza)
#
# test-scripts.sh §3 verifica: ogni `pin` esiste e contiene `key`; nessun
# componente tracked senza pin; percentuale tracked stampata (riga Misura di P1).

[[component]]
id = "litellm"
layer = "gateway"
scope = "vm"
required = true
pin = "services/Dockerfile"
key = "ghcr.io/berriai/litellm-database"
tracked = true
adr = ["0001", "0020"]

