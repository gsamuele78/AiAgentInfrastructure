# Pin di componenti che Dependabot NON sa leggere (installer upstream).
# Li aggiorna scripts/bump-pins.sh (ADR-0026): mise sceglie la versione con
# il cooldown di ADR-0020, .github/workflows/pin-bump.yml apre la PR ogni
# settimana. `# bump: <spec>` dice a mise cosa cercare; senza, la riga resta a mano.
# Formato shell (CHIAVE=valore), sorgato dagli script. Non si chiama *.env
# apposta: .gitignore e HC-08 trattano *.env come segreti.
# Versionati qui perche' "l'ultima" non e' riproducibile ne' annullabile.
# Ollama: l'installer ufficiale accetta OLLAMA_VERSION (scripts/install.sh upstream).
OLLAMA_VERSION=0.40.7  # bump: github:ollama/ollama
# Strato S3 (ADR-0024): mise gestisce Node/opencode/graphify; il frammento di
# mise si genera da questi pin (scripts/install-user-tools.sh). Node: LTS 24.
NODE_VERSION=24.22.0  # bump: node@24
MISE_VERSION=2026.10.15  # bump: github:jdx/mise
